<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Sistema de Votaciones</title>
  </head>
  <body>
    <!-- Fondo decorativo -->
    <div class="fondo-ruido"></div>

    <main class="encuesta-contenedor">
      <!-- Encabezado -->
      <header class="encabezado">
        <span class="etiqueta">ENCUESTA ACTIVA</span>

        <!-- ROL 2: reemplazar <div> genérico por rol heading apropiado -->
        <h1 class="pregunta">¿Qué deporte practicas?</h1>

        <p class="subtitulo">
          Vota una sola vez. Los resultados se mostrarán al instante.
        </p>
      </header>

      <!-- Opciones -->
      <section class="opciones" aria-label="Opciones de votación">

        <!-- Opción 1 -->
        <!-- ROL 2: clase .opcion (no .opcion1) para consistencia con CSS -->
        <div class="opcion" id="opc1">
          <div class="opcion-top">
            <div class="opcion-info" role="heading" aria-level="2">
              <span class="opcion-num">01</span>
              <span class="opcion-texto">FÚTBOL</span>
            </div>

            <!-- ROL 2: aria-label descriptivo en cada botón de voto -->
            <button class="btn-voto" id="btn-opcion1" aria-label="Votar por opción 1: Fútbol">
              <!-- ROL 4: span visible con nombre de opción dentro del button -->
              <span>Votar por Fútbol</span>
            </button>
          </div>

          <div class="barra-fondo">
            <!-- ROL 2: span class="pct-texto" id="span-pctN" al lado de cada barra -->
            <div class="barra-relleno" id="bar1"></div>
          </div>

          <div class="opcion-meta">
            <span class="pct-texto" id="span-pct1">0%</span>
          </div>
        </div>

        <!-- Opción 2 -->
        <div class="opcion" id="opc2">
          <div class="opcion-top">
            <div class="opcion-info" role="heading" aria-level="2">
              <span class="opcion-num">02</span>
              <span class="opcion-texto">BALONCESTO</span>
            </div>

            <button class="btn-voto" id="btn-opcion2" aria-label="Votar por opción 2: Baloncesto">
              <span>Votar por Baloncesto</span>
            </button>
          </div>

          <div class="barra-fondo">
            <div class="barra-relleno" id="bar2"></div>
          </div>

          <div class="opcion-meta">
            <span class="pct-texto" id="span-pct2">0%</span>
          </div>
        </div>

        <!-- Opción 3 -->
        <div class="opcion" id="opc3">
          <div class="opcion-top">
            <div class="opcion-info" role="heading" aria-level="2">
              <span class="opcion-num">03</span>
              <span class="opcion-texto">BOXEO</span>
            </div>

            <button class="btn-voto" id="btn-opcion3" aria-label="Votar por opción 3: Boxeo">
              <span>Votar por Boxeo</span>
            </button>
          </div>

          <div class="barra-fondo">
            <div class="barra-relleno" id="bar3"></div>
          </div>

          <div class="opcion-meta">
            <span class="pct-texto" id="span-pct3">0%</span>
          </div>
        </div>
      </section>

      <!-- ROL 2: #mensaje y #btn-reiniciar con clase .oculto por defecto -->
      <!-- ROL 3: mensaje con textContent inyectado desde JS -->
      <span id="mensaje" class="oculto"></span>

      <!-- ROL 4: #btn-reiniciar con ícono de recarga 🔄 -->
      <!-- ROL 2: btn-reiniciar con clase .oculto por defecto -->
      <button id="btn-reiniciar" class="oculto">🔄 Votar de nuevo</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
